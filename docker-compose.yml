# Single-container stack (matches the ECR production image).
# Prerequisites: cp .env.example .env and fill required values.
#
#   docker compose up --build
#   open http://localhost:8080

services:
  app:
    build:
      context: .
      target: production
    image: agentathon:local
    env_file:
      - .env
    ports:
      - "8080:8000"
    volumes:
      - job-runtime:/app/backend/.runtime
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  job-runtime:
