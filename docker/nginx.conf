# Serves the Vite SPA and reverse-proxies /api to the Compose service `api:8000`.
# Same-origin /api is required: the UI uses relative API paths, and the API CORS
# allow-list only includes local Vite ports (5173/4173).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Workbook uploads (multipart) exceed nginx's default 1m limit.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Job packaging / approve-edits and SSE streams can run a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Required for text/event-stream (GET /api/jobs/{id}/events).
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SPA fallback for react-router BrowserRouter paths (e.g. /jobs/:id/edit).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
